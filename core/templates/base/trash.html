{% extends 'admin/base.html' %}

{% block content %}
<h1>Dashboard</h1>

<div class="card border-info " style="max-width: 18rem; min-height: 8rem">
    <div class="card-body text-primary">
      <h3 class="card-title">Trace Network</h3>
          <button type="button" class="btn btn-primary btn-sm" id="btn-show" onclick="toggle()">
              Start Scanning
          </button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-hide" onclick="toggle()" style="display:none">
            Stop Scanning
        </button>
        <h5 id="time-caption" style="display:none">Scanning...</h5>



    </div>
</div>

<div id="counts-container">
    {% for model, count in counts.items %}
    <div class="module">
        <table>
            <caption>{{ model }}</caption>
            <tr>
                <th>Total Records</th>
                <td class="count">{{ count }}</td>
            </tr>
        </table>
    </div>
    {% endfor %}
</div>

<script>
    // refresh counts every 30 seconds
    setInterval(() => {
        fetch(window.location.href)
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser()
                const doc = parser.parseFromString(html, 'text/html')
                document.getElementById('counts-container').innerHTML =
                    doc.getElementById('counts-container').innerHTML
            })
    }, 30000)

    function toggle() {
        const container = document.getElementById('time-caption')
        const btnShow = document.getElementById('btn-show')
        const btnHide = document.getElementById('btn-hide')

        const isHidden = container.style.display === 'none'
        container.style.display = isHidden ? 'block' : 'none'
        btnShow.style.display = isHidden ? 'none' : 'block'
        btnHide.style.display = isHidden ? 'block' : 'none'
    }
</script>
{% endblock
